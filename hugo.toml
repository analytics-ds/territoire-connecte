baseURL = "https://analytics-ds.github.io/territoire-connecte/"
title = "Territoire Connecté"
theme = "territoire"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
removePathAccents = true
capitalizeListTitles = false
enableRobotsTXT = true
enableEmoji = false
summaryLength = 30

[pagination]
  pagerSize = 12

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark.renderer]
    unsafe = true

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[params]
  default_og_image = "images/og-default.jpg"
  logo = "favicon.svg"
  founding_year = "2026"
  expertise = ["Plateformes de données territoriales", "Souveraineté numérique", "Gestion technique urbaine"]
  og_locale_alternate = "en_US"

[languages]
  [languages.fr]
    locale = "fr-FR"
    label = "Français"
    weight = 1
    title = "Territoire Connecté"
    contentDir = "content/fr"
    [languages.fr.params]
      description = "Analyses, cas d'usage et repères sur les plateformes de données, l'IA et les services publics qui transforment les territoires."

  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 2
    title = "Territoire Connecté"
    contentDir = "content/en"
    [languages.en.params]
      description = "Analysis, use cases and benchmarks on data platforms, AI and the public services reshaping local territories."

[[languages.fr.menus.footer]]
  name = "Accueil"
